# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
   # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  # Maintain dependencies for uv. Was "pip" until Phase 3 of
  # docs/modernization-plan.md; that ecosystem type only understands
  # pyproject.toml's version strings, not uv.lock, so it kept bumping pins
  # without updating the lockfile - which check-core's `uv sync --locked`
  # (Phase 2c) then correctly rejected on every such PR.
  - package-ecosystem: "uv"
    directory: "/core"
    schedule:
      interval: "daily"
  # Maintain dependencies for npm
  - package-ecosystem: "npm" 
    directory: "/ui" 
    schedule:
      interval: "daily"