name: build-project

on:
  push:
  pull_request:
    branches: main
  release:
    types: [published]

env:
  REGISTRY_GITHUB: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PACKAGE_BRANCHES: '["main"]'

jobs:
  variables:
    outputs:
      ref_name: ${{ steps.var.outputs.ref_name}}
    runs-on: "ubuntu-latest"
    steps:
      - name: Setting global variables
        uses: actions/github-script@v9
        id: var
        with:
          script: |
            core.setOutput('ref_name', '${{ github.ref_name }}'.toLowerCase().replaceAll(/[/.]/g, '-').trim('-'));

  # Lint, type check and tests. Runs before anything is built, and independently
  # of the UI, so a lint error fails within a minute instead of after a full
  # Angular build.
  check-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version:
          - '3.13'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # setuptools-scm derives the version from tags on the repository root.
        fetch-depth: 0

    - name: Set up uv
      uses: astral-sh/setup-uv@v10
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: "core/uv.lock"

    - name: Install package with dev dependencies
      run: uv sync --extra dev --locked
      working-directory: core

    - name: Lint with ruff
      run: uv run --no-sync ruff check .
      working-directory: core

    - name: Check formatting with ruff
      run: uv run --no-sync ruff format --check .
      working-directory: core

    - name: Type check with pyright
      run: uv run --no-sync pyright
      working-directory: core

    - name: Run tests with coverage
      run: uv run --no-sync pytest --cov=learninghouse --cov-report=xml:coverage.xml
      working-directory: core

  # Karma/Jasmine suite. Runs before the UI is built, same reasoning as check-core:
  # a failing spec or a coverage regression should fail within a minute, not after
  # a full Angular build.
  check-ui:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json

    - name: Install dependencies
      run: npm install
      working-directory: ui

    - name: Run tests with coverage
      run: npm test -- --watch=false --browsers=ChromeHeadlessCI --code-coverage
      working-directory: ui

  build-ui:
    runs-on: ubuntu-latest
    needs: [variables, check-ui]
    env:
      REF_NAME: ${{ needs.variables.outputs.ref_name }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: ui/package-lock.json

    - name: Install dependencies
      run: npm install
      working-directory: ui

    - name: Build
      run: npm run build:core
      working-directory: ui

    - name: Save angular artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ui-artifacts-${{ env.REF_NAME }}
        path: |
          ui/dist/learninghouse/browser/**

  build-core:
    runs-on: ubuntu-latest
    needs: [variables, check-core, build-ui]
    env:
      REF_NAME: ${{ needs.variables.outputs.ref_name }}
    permissions:
      id-token: write
      contents: write
    strategy:
      matrix:
        python-version:
          - '3.13'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # setuptools-scm derives the version from tags on the repository root.
        fetch-depth: 0

    - name: Set up uv
      uses: astral-sh/setup-uv@v10
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-dependency-glob: "core/uv.lock"

    - name: Download UI
      uses: actions/download-artifact@v8
      with:
        name: ui-artifacts-${{ env.REF_NAME }}
        path: core/learninghouse/ui

    - name: Build package
      run: uv build
      working-directory: core

    - name: Save python artifacts
      uses: actions/upload-artifact@v7
      with:
        name: python-artifacts-${{ matrix.python-version }}-${{ env.REF_NAME }}
        path: |
          core/dist

    - name: Publish package to pypi
      if: ${{github.event_name == 'release' && matrix.python-version == '3.13'}}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: core/dist/

    - name: Publish assets to github
      if: ${{github.event_name == 'release' && matrix.python-version == '3.13'}}
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ github.token }}
        file: core/dist/*
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true

  build-docker:
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    needs: [variables, build-core]
    env:
      REF_NAME: ${{ needs.variables.outputs.ref_name }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # The image installs the wheel built above, which already contains the UI
    # and the version. No source tree and no version freezing needed.
    - name: Download python artifacts
      uses: actions/download-artifact@v8
      with:
        name: python-artifacts-3.13-${{ env.REF_NAME }}
        path: docker/dist

    - name: Set up QEMU
      uses: docker/setup-qemu-action@master
      with:
        platforms: all

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@master

    - name: Log in to the Docker github container registry
      if: ${{github.event_name == 'release' || (github.event_name == 'push' && github.ref_name == 'main')}}
      uses: docker/login-action@v4.5.2
      with:
        registry: ${{ env.REGISTRY_GITHUB }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to the Docker container registry
      if: ${{github.event_name == 'release'}}
      uses: docker/login-action@v4.5.2
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker (No Release)
      id: meta
      if: ${{github.event_name != 'release'}}
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.REGISTRY_GITHUB }}/${{ env.IMAGE_NAME }}

    - name: Extract metadata (tags, labels) for Docker (Release)
      id: meta_release
      if: ${{github.event_name == 'release'}}
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.IMAGE_NAME }}
          ${{ env.REGISTRY_GITHUB }}/${{ env.IMAGE_NAME }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: docker
        push: ${{github.event_name == 'release' || (github.event_name == 'push' && contains(fromJSON(env.PACKAGE_BRANCHES), github.ref_name))}}
        tags: ${{github.event_name == 'release' && steps.meta_release.outputs.tags || steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
