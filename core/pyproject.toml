[project]
name = "learninghouse"
dynamic = ["version"]
description = "learningHouse - Teach your smart home everything"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13,<4"
license = "MIT"
authors = [
    { name = "Johannes Ott", email = "info@johannes-ott.net" }
]
keywords = ["smart home", "machine learning", "house automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Home Automation",
    "Framework :: FastAPI",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "argon2-cffi==25.1.0",
    "argon2-cffi-bindings==26.1.0",
    "fastapi==0.141.1",
    "joblib==1.6.0",
    "loguru==0.7.3",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "pydantic==2.13.5",
    "PyJWT==2.13.0",
    "PyYAML==6.0.3",
    "scikit-learn==1.9.0",
    "scipy==1.18.1",
    "uvicorn[standard]==0.52.4",
]

[project.urls]
Homepage = "https://github.com/LearningHouseService/learninghouse"
Documentation = "https://learninghouseservice.github.io/learninghouse/"
Repository = "https://github.com/LearningHouseService/learninghouse"
Issues = "https://github.com/LearningHouseService/learninghouse/issues"

[project.optional-dependencies]
dev = [
    "setuptools-scm[toml]==10.2.1",
    "ruff==0.16.5",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "httpx==0.28.1",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
]

[project.scripts]
learninghouse = "learninghouse.__main__:main"
learninghouse-migrate-config = "learninghouse.scripts.migrate_config:main"

[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "setuptools-scm[toml]>=8"
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["learninghouse*"]
exclude = ["tests*", "*.egg-info*"]
namespaces = true

[tool.setuptools_scm]
root = ".."
version_scheme = "post-release"
local_scheme = "node-and-date"
tag_regex = "^v(?P<version>[vV]?[0-9]+[^\\+]*)(\\+.*)?$"
fallback_version = "0.0.0"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short -n auto --dist=worksteal"
markers = [
    "slow"
]

[tool.coverage.run]
source = ["learninghouse"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 87
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
